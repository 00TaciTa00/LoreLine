name: 버그
description: 동작이 기대와 다를 때
labels: ["버그"]
body:
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 일어났나
      description: 어느 화면에서 무엇을 했고 어떻게 됐는지
      placeholder: |
        공간 탭에서 "관련 사건"을 눌렀는데 목록이 비어 있었다.
        사건은 분명히 연결해둔 상태였다.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 어떻게 되어야 하나
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: 어디서
      description: 프로덕션인지 로컬인지, 어느 세계관·화면인지
      placeholder: 프로덕션 / FF14-판데모니움 / 공간 탭

  - type: textarea
    id: notes
    attributes:
      label: 그 밖에
      description: 콘솔 오류, 스크린샷, 재현이 되다 안 되다 하는 조건 등
